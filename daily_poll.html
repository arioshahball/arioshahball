<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>پیش‌بینی بازی شب - آریوشاه</title>
    <style>
        body {
            background: linear-gradient(135deg, #0A192F, #1A2A3A);
            font-family: Arial, sans-serif;
            direction: rtl;
            padding: 20px;
            min-height: 100vh;
            margin: 0;
            color: #fff;
        }
        h1 {
            color: #E74C3C;
            text-align: center;
            font-size: 45px;
            text-shadow: 0 0 25px rgba(231, 76, 60, 0.6);
            border-bottom: 4px solid #E74C3C;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .poll-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 35px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .match-info {
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 20px;
        }
        .vs {
            color: #E74C3C;
            margin: 0 15px;
        }
        .option {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .option:hover {
            background: rgba(52, 152, 219, 0.2);
            border-color: #3498DB;
        }
        .glass-btn {
            display: inline-block;
            background: rgba(52, 152, 219, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(52, 152, 219, 0.3);
            border-radius: 50px;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            color: #E74C3C;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(52, 152, 219, 0.2);
            cursor: pointer;
            margin: 10px 5px;
        }
        .glass-btn:hover {
            background: rgba(52, 152, 219, 0.25);
            box-shadow: 0 8px 30px rgba(52, 152, 219, 0.4);
            transform: translateY(-3px);
            border-color: #E74C3C;
        }
        .result-bar {
            display: flex;
            align-items: center;
            margin: 10px 0;
            direction: ltr;
        }
        .result-bar .label {
            width: 130px;
            text-align: right;
            color: #fff;
            font-size: 15px;
        }
        .result-bar .bar {
            flex: 1;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            overflow: hidden;
            margin: 0 10px;
        }
        .result-bar .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #E74C3C, #FFD700);
            border-radius: 30px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .result-bar .percent {
            width: 50px;
            color: #FFD700;
            font-weight: bold;
        }
        .reset-btn {
            background: #E74C3C;
            color: #fff;
            border: none;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
        .reset-btn:hover {
            background: #C0392B;
            transform: scale(1.05);
        }
        .back-link {
            display: block;
            margin-top: 30px;
            text-align: center;
            font-size: 18px;
        }
        .back-link a {
            color: #3498DB;
            text-decoration: none;
        }
        .back-link a:hover {
            color: #E74C3C;
        }
    </style>
</head>
<body>

    <h1>⚽ پیش‌بینی بازی شب</h1>

    <div class="poll-box">
        <div class="match-info">
            <span id="homeTeam">رئال مادرید</span>
            <span class="vs">⚔️</span>
            <span id="awayTeam">بارسلونا</span>
        </div>

        <div id="optionsContainer">
            <button class="option" data-value="home">برد <span id="homeName">رئال مادرید</span></button>
            <button class="option" data-value="draw">🤝 مساوی</button>
            <button class="option" data-value="away">برد <span id="awayName">بارسلونا</span></button>
        </div>

        <div id="resultsContainer" style="display: none; margin-top: 20px;">
            <div class="result-bar"><span class="label" id="labelHome">رئال مادرید</span><div class="bar"><div class="fill" id="barHome"></div></div><span class="percent" id="percentHome">0%</span></div>
            <div class="result-bar"><span class="label">🤝 مساوی</span><div class="bar"><div class="fill" id="barDraw"></div></div><span class="percent" id="percentDraw">0%</span></div>
            <div class="result-bar"><span class="label" id="labelAway">بارسلونا</span><div class="bar"><div class="fill" id="barAway"></div></div><span class="percent" id="percentAway">0%</span></div>
            <button class="reset-btn" onclick="resetPoll()">🔄 شروع مجدد</button>
        </div>

        <div style="margin-top: 30px;">
            <a href="index.html" class="glass-btn">🏠 خانه</a>
            <button class="glass-btn" onclick="editMatch()">✏️ تغییر بازی</button>
        </div>
    </div>

    <div class="back-link">
        <a href="index.html">⬅ برگشت به صفحه اصلی</a>
    </div>

    <script>
        // ===== تنظیمات پیش‌فرض (هر شب عوض کن) =====
        let match = {
            home: "رئال مادرید",
            away: "بارسلونا"
        };

        let votes = { home: 0, draw: 0, away: 0 };
        let totalVotes = 0;
        let userVoted = false;
        const STORAGE_KEY = 'dailyPollData';

        // ===== بارگذاری از localStorage =====
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                match = data.match || match;
                votes = data.votes || votes;
                totalVotes = data.totalVotes || 0;
                userVoted = data.userVoted || false;
                updateMatchUI();
                if (totalVotes > 0) showResults();
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ match, votes, totalVotes, userVoted }));
        }

        function updateMatchUI() {
            document.getElementById('homeTeam').textContent = match.home;
            document.getElementById('awayTeam').textContent = match.away;
            document.getElementById('homeName').textContent = match.home;
            document.getElementById('awayName').textContent = match.away;
            document.getElementById('labelHome').textContent = match.home;
            document.getElementById('labelAway').textContent = match.away;
        }

        function showResults() {
            document.getElementById('optionsContainer').style.display = 'none';
            document.getElementById('resultsContainer').style.display = 'block';
            const total = totalVotes || 1;
            const homeP = Math.round((votes.home / total) * 100);
            const drawP = Math.round((votes.draw / total) * 100);
            const awayP = Math.round((votes.away / total) * 100);
            document.getElementById('barHome').style.width = homeP + '%';
            document.getElementById('percentHome').textContent = homeP + '%';
            document.getElementById('barDraw').style.width = drawP + '%';
            document.getElementById('percentDraw').textContent = drawP + '%';
            document.getElementById('barAway').style.width = awayP + '%';
            document.getElementById('percentAway').textContent = awayP + '%';
        }

        function vote(choice) {
            if (userVoted) {
                alert('شما قبلاً رای دادید!');
                return;
            }
            votes[choice]++;
            totalVotes++;
            userVoted = true;
            saveData();
            showResults();
        }

        function resetPoll() {
            if (!confirm('همه آرا پاک میشه. ادامه میدی؟')) return;
            votes = { home: 0, draw: 0, away: 0 };
            totalVotes = 0;
            userVoted = false;
            saveData();
            document.getElementById('optionsContainer').style.display = 'block';
            document.getElementById('resultsContainer').style.display = 'none';
        }

        function editMatch() {
            const newHome = prompt('تیم میزبان رو وارد کن:', match.home);
            if (newHome && newHome.trim() !== '') {
                const newAway = prompt('تیم میهمان رو وارد کن:', match.away);
                if (newAway && newAway.trim() !== '') {
                    match.home = newHome.trim();
                    match.away = newAway.trim();
                    resetPoll();
                    updateMatchUI();
                    saveData();
                }
            }
        }

        // ===== اتصال دکمه‌ها =====
        document.querySelectorAll('.option').forEach(btn => {
            btn.addEventListener('click', () => vote(btn.dataset.value));
        });

        // ===== بارگذاری =====
        loadData();
    </script>

</body>
</html>
