<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>آریوشاه - اخبار فوتبال</title>
    <style>
        body {
            background-image: url('https://wallpaper.dog/large/10876632.jpg');
            background-size: cover;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            direction: rtl;
            padding: 20px;
        }
        h1 {
            color: #ff9800;
            text-align: center;
            font-size: 45px;
            text-shadow: 0 0 20px rgba(255, 152, 0, 0.5);
            border-bottom: 4px solid #ff9800;
            padding-bottom: 15px;
            margin-bottom: 40px;
        }
        .news-box {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border-right: 6px solid #ff9800;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }
        .news-box h2 {
            color: #1e3c72;
        }
        .news-box img {
            width: 100%;
            border-radius: 12px;
            margin: 10px 0;
        }
        .news-box small {
            display: block;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>⚽ آریوشاه - مرجع اخبار فوتبال</h1>

    <div class="news-box">
        <h2>آرسنال دنبال جذب وینیسیوس</h2>
        <p>رسانه‌ها از علاقه آرسنال به وینیسیوس جونیور خبر دادن.</p>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgFL6anX_D2EE9CjpdZcB1MBb2q2Cyc6Pv09Vz1zqhNg&s=10" alt="آرسنال">
        <small>منتشر شده: امروز</small>
    </div>

    <div class="news-box">
        <h2>لیورپول ۴ - ۰ ساندرلند</h2>
        <p>لیورپول در هفته پایانی لیگ، ساندرلند رو ۴ بر صفر شکست داد.</p>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT231Ajy4i1MQ4-hs8zVW_aFLA0Eg&s=10" alt="لیورپول">
        <small>منتشر شده: امروز</small>
    </div>

</body>
</html>
