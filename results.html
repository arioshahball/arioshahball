<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>نتایج لیگ - آریوشاه</title>
    <style>
        body {
            background: linear-gradient(135deg, #0A192F, #1A2A3A);
            font-family: Arial, sans-serif;
            direction: rtl;
            padding: 20px;
            min-height: 100vh;
            margin: 0;
        }

        /* ===== تیتر اصلی با رنگ قرمز و پررنگ ===== */
        h1 {
            color: #E74C3C;             /* قرمز */
            font-weight: 900;           /* بولد خیلی پررنگ */
            text-align: center;
            font-size: 45px;
            text-shadow: 0 0 25px rgba(0, 230, 118, 1);
            border-bottom: 4px solid #00e676;
            padding-bottom: 15px;
            margin-bottom: 40px;
        }

        /* ===== باکس شیشه‌ای آبی دور جدول ===== */
        .table-container {
            background: rgba(52, 152, 219, 0.10);   /* آبی شفاف */
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 24px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(52, 152, 219, 0.3);
            border: 2px solid rgba(52, 152, 219, 0.25);  /* حاشیه آبی */
            overflow-x: auto;
        }

        table {
            width: 100%;
            color: #fff;
            text-align: center;
            border-collapse: collapse;
        }

        th {
            background: rgba(231, 76, 60, 0.2);
            color: #E74C3C;
            font-size: 20px;
            padding: 15px 10px;
            border-bottom: 2px solid #E74C3C;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 18px;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .score {
            font-weight: bold;
            color: #FFD700;
            font-size: 22px;
        }

        .home {
            color: #3498DB;
        }

        .away {
            color: #E74C3C;
        }

        .back-link {
            display: block;
            margin-top: 40px;
            text-align: center;
            font-size: 18px;
        }

        .back-link a {
            color: #3498DB;
            text-decoration: none;
            transition: 0.3s;
            padding: 10px 25px;
            border-radius: 30px;
            background: rgba(52, 152, 219, 0.15);
        }

        .back-link a:hover {
            color: #E74C3C;
            background: rgba(231, 76, 60, 0.2);
        }
    </style>
</head>
<body>
<h1>⚽ مهم‌ترین نتایج بازی‌های نیم‌فصل هفته</h1>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>تیم میزبان</th>
                    <th>نتیجه</th>
                    <th>تیم میهمان</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="home">بایرن مونیخ</td>
                    <td class="score">2 - 1</td>
                    <td class="away">استون ویلا</td>
                </tr>
                <tr>
                    <td class="home">ولوز</td>
                    <td class="score">3 - 0</td>
                    <td class="away">پورت واله</td>
                </tr>
                <tr>
                    <td class="home">کی لیگ ال استار</td>
                    <td class="score">1 - 3</td>
                    <td class="away">منچسترسیتی</td>
                </tr>
                <tr>
                    <td class="home">اینتر میلان</td>
                    <td class="score">1 - 1</td>
                    <td class="away">اث میلان</td>
                </tr>
                <tr>
                    <td class="home">چلسی</td>
                    <td class="score">0 - 1</td>
                    <td class="away">یوونتوس</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="back-link">
        <a href="index.html">⬅ برگشت به صفحه اصلی</a>
    </div>

</body>
</html>
